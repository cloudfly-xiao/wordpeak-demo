<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#5766f5">
  <meta name="description" content="词峰 WordPeak · 高中英语单词集训系统（演示版）：看词选义 / 听音识词 / 拼写挑战 / 错词本 / 间隔复习 / 学情统计">
  <title>词峰 WordPeak · 高中英语单词集训系统</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235766f5'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Cpath d='M20 74 L44 32 L56 50 L66 38 L80 74 Z' fill='%23fff'/%3E%3C/svg%3E">
  <script>
    /* 防主题闪烁：在样式表加载前解析主题 */
    (function () {
      var m = 'light';
      try {
        var v = JSON.parse(localStorage.getItem('wordpeak_ui'));
        v = v && v.theme || 'auto';
        m = v === 'dark' || (v === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', m);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18 10 6l4 6.5L17 9l4 9z"/></svg>
        </span>
        <span class="brand-txt"><b>词峰</b><i>高中英语单词集训 · 演示版</i></span>
      </div>
      <div class="top-actions">
        <div class="streak-chip" id="streakChip" title="连续打卡">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
          <span id="streakNum" class="tnum">0</span> 天
        </div>
        <button class="icon-btn" id="themeBtn" aria-label="切换主题" title="主题：跟随系统"></button>
      </div>
    </header>

    <main id="view"></main>

    <nav id="tabbar" aria-label="主导航">
      <button class="tab on" data-tab="home">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
        <span>首页</span>
      </button>
      <button class="tab" data-tab="review" style="position:relative">
        <em class="tab-badge hidden" id="dueBadge">0</em>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        <span>复习</span>
      </button>
      <button class="tab" data-tab="wrong">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>错词本</span>
      </button>
      <button class="tab" data-tab="stats">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M6 21v-8"/><path d="M12 21V4"/><path d="M18 21v-12"/></svg>
        <span>统计</span>
      </button>
    </nav>
  </div>

  <!-- 单元模式选择 弹层 -->
  <div id="sheetWrap" class="hidden">
    <div class="mask" data-act="sheet-close"></div>
    <div class="sheet" id="sheet"></div>
  </div>

  <!-- 训练会话 全屏层 -->
  <div id="session" class="hidden"></div>

  <div id="toast" role="status"></div>

  <script src="js/words.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
